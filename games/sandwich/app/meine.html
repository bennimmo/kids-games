<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#140d07">
<title>My sandwiches</title>
<link rel="icon" href="./favicon.svg" type="image/svg+xml">
<style>
  :root { --bg: #140d07; --fg: #f5ead8; --dim: #b9a68c; --card: #241810; --accent: #f2b33d; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.4 system-ui, sans-serif; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: calc(14px + env(safe-area-inset-top)) 16px 14px 76px; }
  h1 { margin: 0; font-size: 22px; }
  a.btn, button { font: inherit; color: var(--bg); background: var(--accent); border: 0; border-radius: 999px;
    padding: 10px 18px; text-decoration: none; cursor: pointer; font-weight: 700; }
  button.ghost { background: transparent; color: var(--fg); border: 2px solid var(--dim); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; padding: 0 16px 24px; }
  .grid button { padding: 0; border-radius: 14px; overflow: hidden; background: var(--card); position: relative; aspect-ratio: 1; }
  .grid img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .grid span { position: absolute; left: 8px; bottom: 8px; background: rgba(0,0,0,.6); color: var(--fg);
    font-size: 13px; padding: 2px 8px; border-radius: 999px; }
  .empty { padding: 40px 16px; text-align: center; color: var(--dim); }
  .view { position: fixed; inset: 0; background: rgba(10,6,3,.94); display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 16px; padding: 16px; }
  .view[hidden] { display: none; }
  .view img { max-width: min(100%, 720px); max-height: 70vh; border-radius: 12px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
</style>
</head>
<body>
<header>
  <h1>My sandwiches</h1>
  <a class="btn" href="./index.html">New sandwich</a>
</header>
<div class="grid"></div>
<p class="empty" hidden>No sandwiches yet. Take a photo and tap “Keep”.</p>
<div class="view" hidden>
  <img alt="">
  <div class="meta"></div>
  <div class="row">
    <button class="share">Share</button>
    <button class="ghost del">Delete</button>
    <button class="ghost close">Back</button>
  </div>
</div>
<script type="module">
import { all, get, remove } from './local-store.js';
const grid = document.querySelector('.grid'), empty = document.querySelector('.empty');
const view = document.querySelector('.view'), big = view.querySelector('img'), meta = view.querySelector('.meta');
let urls = [], open = null, bigUrl = null;

async function draw() {
  urls.forEach(URL.revokeObjectURL); urls = [];
  const list = (await all()).filter(r => r.images?.['thumb.jpg']);
  grid.replaceChildren(...list.map(r => {
    const b = document.createElement('button');
    const img = document.createElement('img');
    const u = URL.createObjectURL(r.images['thumb.jpg']); urls.push(u);
    img.src = u; img.alt = 'Sandwich ' + r.id;
    const n = document.createElement('span'); n.textContent = 'No. ' + r.id;
    b.append(img, n);
    b.onclick = () => show(r.id);
    return b;
  }));
  empty.hidden = list.length > 0;
}
async function show(id) {
  const r = await get(id); if (!r) return;
  open = r;
  if (bigUrl) URL.revokeObjectURL(bigUrl);
  bigUrl = URL.createObjectURL(r.images['photo.jpg'] || r.images['thumb.jpg']);
  big.src = bigUrl;
  meta.textContent = 'Sandwich No. ' + r.id + ' · ' + new Date(r.created).toLocaleDateString('en-GB');
  view.hidden = false;
  history.replaceState(null, '', '#' + id);
}
function hide() { view.hidden = true; open = null; history.replaceState(null, '', location.pathname); }
view.querySelector('.close').onclick = hide;
view.querySelector('.del').onclick = async () => {
  if (!open || !confirm('Delete this sandwich?')) return;
  await remove(open.id); hide(); draw();
};
view.querySelector('.share').onclick = async () => {
  const blob = open?.images?.['photo.jpg']; if (!blob) return;
  const file = new File([blob], `sandwich-${open.id}.jpg`, { type: 'image/jpeg' });
  if (navigator.canShare?.({ files: [file] })) { try { await navigator.share({ files: [file] }); } catch {} return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = file.name; a.click();
};
await draw();
const id = Number(location.hash.slice(1));
if (id) show(id);
</script>
</body>
</html>
